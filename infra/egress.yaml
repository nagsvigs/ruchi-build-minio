# LiveKit Egress config — LOCAL DEV ONLY.
# Connects to the local LiveKit server, uses the local Redis queue, and
# uploads finished recordings to the local MinIO (S3-compatible) bucket.

log_level: info

api_key: devkey
api_secret: secretsecretsecretsecretsecretsecret12
ws_url: ws://livekit:7880
insecure: true

health_port: 9090

redis:
  address: redis:6379
  username: ""
  password: ""
  db: 0
  use_tls: false

# Upload target. `force_path_style` is required for MinIO (bucket in the
# URL path, not a subdomain).
storage:
  s3:
    access_key: minioadmin
    secret: minioadmin
    region: us-east-1
    endpoint: http://minio:9000
    bucket: recordings
    force_path_style: true
